spec_version: "0.1.0"
name: "radiomics-biomarker-extractor"
version: "1.0.0"
category: "healthcare"
author: "Rucha Salpure"
description: "Extracts standardized IBSI-compliant radiomic texture, shape, and intensity features from oncology CT/MRI DICOM scans to forecast therapeutic response"
capabilities:
  - "ibsi-radiomic-extraction"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "ibsi-radiomic-extraction"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
